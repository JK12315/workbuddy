<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>美少女工作台 · 可爱风个人工作台</title>
<meta name="description" content="可爱风少女系个人工作台 - 学习/生活/理财一站式记录">
<meta name="theme-color" content="#9B7EDE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="美少女工作台">
<meta name="msapplication-TileColor" content="#9B7EDE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
/* ==================== CSS 变量与主题 ==================== */
:root{
  --radius-sm:8px; --radius-md:16px; --radius-lg:24px; --radius-pill:999px;
  --font-base:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-cute:"Comic Sans MS","Yuanti SC","PingFang SC",cursive;
  --transition:all .3s cubic-bezier(.4,0,.2,1);
  /* 默认=薰衣草紫 */
  --bg-primary:#F5F0FF; --bg-secondary:#FFFFFF; --bg-tertiary:#E8DCFF; --bg-hover:#F0E8FF;
  --text-primary:#4A3B6B; --text-secondary:#8B7BA8; --text-muted:#B5A8CC;
  --accent:#9B7EDE; --accent-light:#C8B6E2; --accent-dark:#6A4C93;
  --accent-gradient:linear-gradient(135deg,#C8B6E2 0%,#9B7EDE 100%);
  --border:#E8DCFF; --shadow:rgba(155,126,222,.15); --shadow-hover:rgba(155,126,222,.3);
  --nav-bg:#FFFFFF; --nav-active:#F0E8FF;
  --success:#7ED9A1; --warning:#FFD166; --danger:#FF8FA3; --star:#FFD166;
}
body[data-theme="sakura"]{
  --bg-primary:#FFF5F7; --bg-secondary:#FFFFFF; --bg-tertiary:#FFE4EC; --bg-hover:#FFD6E4;
  --text-primary:#6B3B4A; --text-secondary:#A87889; --text-muted:#CCA8B5;
  --accent:#FF6B9D; --accent-light:#FFB6C1; --accent-dark:#E91E63;
  --accent-gradient:linear-gradient(135deg,#FFB6C1 0%,#FF6B9D 100%);
  --border:#FFE4EC; --shadow:rgba(255,107,157,.15); --shadow-hover:rgba(255,107,157,.3);
  --nav-bg:#FFFFFF; --nav-active:#FFE4EC; --danger:#FF6B9D;
}
body[data-theme="mint"]{
  --bg-primary:#F0FFF4; --bg-secondary:#FFFFFF; --bg-tertiary:#D4F1DE; --bg-hover:#C1E8D0;
  --text-primary:#2B5C40; --text-secondary:#5E8C70; --text-muted:#9BB8A6;
  --accent:#5FC9A0; --accent-light:#A8E6CF; --accent-dark:#2E8B57;
  --accent-gradient:linear-gradient(135deg,#A8E6CF 0%,#5FC9A0 100%);
  --border:#D4F1DE; --shadow:rgba(95,201,160,.15); --shadow-hover:rgba(95,201,160,.3);
  --nav-bg:#FFFFFF; --nav-active:#D4F1DE; --success:#5FC9A0;
}
body[data-theme="lavender"]{
  --bg-primary:#F5F0FF; --bg-secondary:#FFFFFF; --bg-tertiary:#E8DCFF; --bg-hover:#F0E8FF;
  --text-primary:#4A3B6B; --text-secondary:#8B7BA8; --text-muted:#B5A8CC;
  --accent:#9B7EDE; --accent-light:#C8B6E2; --accent-dark:#6A4C93;
  --accent-gradient:linear-gradient(135deg,#C8B6E2 0%,#9B7EDE 100%);
  --border:#E8DCFF; --shadow:rgba(155,126,222,.15); --shadow-hover:rgba(155,126,222,.3);
  --nav-bg:#FFFFFF; --nav-active:#F0E8FF;
}
body[data-theme="butter"]{
  --bg-primary:#FFFDF5; --bg-secondary:#FFFFFF; --bg-tertiary:#FFF3CC; --bg-hover:#FFEBB0;
  --text-primary:#6B5A2B; --text-secondary:#A89060; --text-muted:#CCB890;
  --accent:#F5C242; --accent-light:#FFE082; --accent-dark:#D4A017;
  --accent-gradient:linear-gradient(135deg,#FFE082 0%,#F5C242 100%);
  --border:#FFF3CC; --shadow:rgba(245,194,66,.15); --shadow-hover:rgba(245,194,66,.3);
  --nav-bg:#FFFFFF; --nav-active:#FFF3CC; --warning:#F5C242;
}
/* ==================== Reset ==================== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior-y:contain}
body{
  font-family:var(--font-base); background:var(--bg-primary); color:var(--text-primary);
  transition:background .4s ease,color .4s ease; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--accent-light);border-radius:var(--radius-pill)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-primary)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-light)}

/* ==================== 布局 ==================== */
.layout{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{
  width:220px;background:var(--nav-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;
  overflow-y:auto;flex-shrink:0;transition:width .3s ease;z-index:50;
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;padding:0 20px 20px;
  border-bottom:1px solid var(--border);margin-bottom:12px;
}
.sidebar-logo .logo-icon{width:40px;height:40px;border-radius:var(--radius-md);overflow:hidden;flex-shrink:0}
.sidebar-logo .logo-icon img{width:100%;height:100%}
.sidebar-logo .logo-text{font-family:var(--font-cute);font-size:18px;font-weight:700;color:var(--accent-dark)}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 20px;margin:2px 8px;
  border-radius:var(--radius-md);color:var(--text-secondary);font-size:14px;font-weight:500;
  transition:var(--transition);position:relative;white-space:nowrap;
}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:var(--nav-active);color:var(--accent-dark);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:24px;background:var(--accent);border-radius:var(--radius-pill)}
.nav-item .nav-emoji{font-size:20px;flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--accent-dark)}
.nav-item .nav-emoji svg{width:20px;height:20px}
.nav-item .nav-label{overflow:hidden;text-overflow:ellipsis}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 28px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;
}
.topbar-title{font-size:20px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.theme-switcher{display:flex;gap:8px;align-items:center}
.theme-switcher .label{font-size:12px;color:var(--text-muted);margin-right:4px}
.theme-btn{
  width:34px;height:34px;border-radius:50%;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-tertiary);transition:var(--transition);opacity:.6;
}
.theme-btn:hover{opacity:1;transform:scale(1.1)}
.theme-btn.active{opacity:1;background:var(--accent);box-shadow:0 2px 8px var(--shadow-hover)}
.content{flex:1;padding:28px 28px calc(28px + env(safe-area-inset-bottom));overflow-y:auto}

/* ==================== 首页卡片 ==================== */
.hero-section{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.card{
  background:var(--bg-secondary);border-radius:var(--radius-lg);padding:24px;
  box-shadow:0 4px 20px var(--shadow);transition:var(--transition);border:1px solid var(--border);
}
.card:hover{box-shadow:0 6px 28px var(--shadow-hover);transform:translateY(-2px)}
.clock-card{background:var(--accent-gradient);color:#fff;border:none;text-align:center;position:relative;overflow:hidden}
.clock-time{font-family:var(--font-cute);font-size:48px;font-weight:700;letter-spacing:2px;position:relative}
.clock-date{font-size:15px;margin-top:8px;opacity:.95;position:relative}
.clock-greeting{font-size:14px;margin-top:12px;opacity:.9;position:relative}
.checkin-card .card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.checkin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.checkin-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;
  border-radius:var(--radius-md);background:var(--bg-tertiary);transition:var(--transition);
  position:relative;border:2px solid transparent;
}
.checkin-item:hover{transform:translateY(-2px);box-shadow:0 4px 12px var(--shadow)}
.checkin-item.done{background:var(--accent);color:#fff;border-color:var(--accent-dark)}
.checkin-item.done::after{content:"✓";position:absolute;top:-6px;right:-6px;width:22px;height:22px;background:var(--success);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.checkin-emoji{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.checkin-emoji svg{width:26px;height:26px}
.checkin-label{font-size:12px;font-weight:500}
.checkin-progress{text-align:center;margin-top:14px;font-size:14px;color:var(--text-secondary)}
.checkin-progress span{color:var(--accent-dark);font-weight:700;font-size:18px}
.motivation-card-full{grid-column:1/-1;background:var(--bg-secondary);border-radius:var(--radius-lg);padding:28px;box-shadow:0 4px 20px var(--shadow);display:flex;align-items:center;gap:20px;border:1px solid var(--border)}
.motivation-icon{font-size:40px;flex-shrink:0}
.motivation-text{flex:1}
.motivation-zh{font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:6px;line-height:1.5}
.motivation-en{font-size:14px;color:var(--text-secondary);font-style:italic;line-height:1.5}
.motivation-date{font-size:12px;color:var(--text-muted);margin-top:8px}

/* ==================== 模块通用样式 ==================== */
.module-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.module-title{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.module-title .emoji{font-size:26px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-secondary);border-radius:var(--radius-md);padding:18px;box-shadow:0 2px 12px var(--shadow);border:1px solid var(--border);transition:var(--transition)}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--shadow-hover)}
.stat-label{font-size:12px;color:var(--text-muted);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.stat-value{font-size:24px;font-weight:700;color:var(--accent-dark);font-family:var(--font-cute)}
.stat-value .unit{font-size:13px;font-weight:400;color:var(--text-secondary);margin-left:2px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-pill);
  font-size:14px;font-weight:600;transition:var(--transition);white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 12px var(--shadow)}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 6px 16px var(--shadow-hover)}
.btn-secondary{background:var(--bg-tertiary);color:var(--text-primary)}
.btn-secondary:hover{background:var(--bg-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-icon{padding:6px 10px;font-size:16px;border-radius:var(--radius-sm);background:var(--bg-tertiary)}
.btn-icon:hover{background:var(--bg-hover)}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:6px 14px;border-radius:var(--radius-pill);font-size:13px;background:var(--bg-tertiary);color:var(--text-secondary);transition:var(--transition)}
.filter-chip:hover{background:var(--bg-hover)}
.filter-chip.active{background:var(--accent);color:#fff}

/* 列表 */
.list-container{display:flex;flex-direction:column;gap:12px}
.list-item{
  background:var(--bg-secondary);border-radius:var(--radius-md);padding:16px 20px;
  box-shadow:0 2px 10px var(--shadow);border:1px solid var(--border);
  display:flex;align-items:center;gap:16px;transition:var(--transition);flex-wrap:wrap;
}
.list-item:hover{box-shadow:0 4px 16px var(--shadow-hover);transform:translateX(2px)}
.list-item .item-main{flex:1;min-width:200px}
.list-item .item-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.list-item .item-field{font-size:13px}
.list-item .item-field .field-label{color:var(--text-muted);margin-right:4px}
.list-item .item-field .field-value{color:var(--text-primary);font-weight:500}
.list-item .item-title{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.list-item .item-actions{display:flex;gap:6px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600}
.badge-income{background:rgba(126,217,161,.2);color:#2E8B57}
.badge-expense{background:rgba(255,143,163,.2);color:#E91E63}
.badge-status{background:var(--bg-tertiary);color:var(--text-secondary)}
.badge-status.s-done{background:rgba(126,217,161,.2);color:#2E8B57}
.badge-status.s-progress{background:rgba(255,209,102,.2);color:#B8860B}
.badge-status.s-pending{background:var(--bg-tertiary);color:var(--text-secondary)}
.badge-status.s-drop{background:rgba(155,155,155,.2);color:#888}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-state .emoji{font-size:48px;display:block;margin-bottom:12px}
.empty-state .text{font-size:14px}
.stars{color:var(--star);letter-spacing:2px}
.progress-bar{height:8px;background:var(--bg-tertiary);border-radius:var(--radius-pill);overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;background:var(--accent-gradient);border-radius:var(--radius-pill);transition:width .5s ease}

/* 模态框 */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px;
  backdrop-filter:blur(4px);animation:fadeIn .2s ease;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--bg-secondary);border-radius:var(--radius-lg);padding:28px;
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .3s ease;
}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.form-group label .req{color:var(--danger);margin-left:2px}
.form-control{
  width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-md);
  background:var(--bg-primary);font-size:14px;color:var(--text-primary);transition:var(--transition);
}
.form-control:focus{border-color:var(--accent);outline:none}
textarea.form-control{resize:vertical;min-height:70px}
select.form-control{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-display{font-size:14px;font-weight:600;color:var(--accent-dark);margin-top:4px}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--text-primary);color:var(--bg-secondary);padding:12px 24px;
  border-radius:var(--radius-pill);font-size:14px;font-weight:500;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  opacity:0;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 视图切换 */
.view{display:none;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.clock-time{animation:breathe 4s ease-in-out infinite}

/* 进度环 */
.water-progress{display:flex;align-items:center;gap:12px}
.water-progress .ring{position:relative;width:56px;height:56px}
.water-progress .ring svg{transform:rotate(-90deg)}
.water-progress .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent-dark)}

/* ==================== 响应式 ==================== */
@media(max-width:1199px){.sidebar{width:180px}.hero-section{grid-template-columns:1fr}}
@media(max-width:991px){
  .sidebar{width:64px;padding:16px 0}
  .sidebar-logo{justify-content:center;padding:0 0 16px}
  .sidebar-logo .logo-text{display:none}
  .nav-item{justify-content:center;padding:12px 8px;margin:2px 6px}
  .nav-item .nav-label{display:none}
  .nav-item.active::before{display:none}
  .nav-item.active{box-shadow:inset 0 0 0 2px var(--accent)}
  .nav-item:hover::after{content:attr(data-label);position:absolute;left:70px;top:50%;transform:translateY(-50%);background:var(--bg-secondary);padding:6px 12px;border-radius:var(--radius-sm);box-shadow:0 4px 12px var(--shadow);white-space:nowrap;z-index:100;font-size:13px;color:var(--text-primary)}
  .checkin-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:767px){
  .layout{flex-direction:column}
  .sidebar{display:none}
  .main{width:100%;order:1}
  .content{padding:16px 16px calc(16px + env(safe-area-inset-bottom)) 36px}
  .topbar{padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  .topbar-title{font-size:16px}
  .theme-switcher .label{display:none}
  .clock-time{font-size:36px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-row{grid-template-columns:1fr}
  .motivation-card-full{flex-direction:column;text-align:center}
  .hero-section{grid-template-columns:1fr}
  .checkin-grid{grid-template-columns:repeat(2,1fr)}
  .list-item{flex-direction:column;align-items:flex-start}
  .list-item .item-actions{width:100%;justify-content:flex-end}
}
/* 移动端汉堡按钮（默认隐藏在桌面端）*/
.mobile-nav-btn{
  display:none;position:fixed;left:0;top:calc(50% + (env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 2);transform:translateY(-50%);
  width:30px;height:88px;background:var(--accent);color:#fff;
  border-radius:0 var(--radius-lg) var(--radius-lg) 0;
  font-size:16px;z-index:60;align-items:center;justify-content:center;
  box-shadow:4px 0 18px var(--shadow-hover);transition:var(--transition);
}
.mobile-nav-btn:hover{background:var(--accent-dark);width:36px}
.mobile-nav-btn::before{content:"☰";font-size:18px}
.mobile-nav-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:150;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
  animation:fadeIn .25s ease;
}
.mobile-nav-overlay.show{display:flex}
.mobile-nav-panel{
  background:var(--accent-gradient);border-radius:var(--radius-lg);
  padding:24px;width:100%;max-width:400px;max-height:82vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.35);animation:slideUp .35s ease;
  position:relative;
}
.mobile-nav-panel::before{content:"";position:absolute;inset:0;border-radius:var(--radius-lg);background:rgba(255,255,255,.08);pointer-events:none}
.mobile-nav-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;color:#fff;font-size:18px;font-weight:700;position:relative;
}
.mobile-nav-close{
  width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);
  color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.mobile-nav-close:hover{background:rgba(255,255,255,.4);transform:rotate(90deg)}
.mobile-nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;position:relative}
.mobile-nav-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:18px 8px;background:rgba(255,255,255,.22);border-radius:var(--radius-md);
  color:#fff;font-size:13px;font-weight:600;transition:var(--transition);
}

/* ==================== 工具函数 ==================== */
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const todayKey = ()=>formatDateKey(new Date());
function formatDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function recentDayKeys(n){const a=[];const t=new Date();for(let i=0;i<n;i++){const d=new Date(t);d.setDate(d.getDate()-i);a.push(formatDateKey(d))}return a}
function monthKey(d=new Date()){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`}
function uid(p='id'){return `${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function weekStart(){const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d}

const Store = {
  get(k,def=null){try{const v=JSON.parse(localStorage.getItem(k));return v??def}catch{return def}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))},
  remove(k){localStorage.removeItem(k)},
  push(k,item){const a=this.get(k,[]);a.push(item);this.set(k,a);return a},
  removeById(k,id){const a=this.get(k,[]).filter(x=>x.id!==id);this.set(k,a);return a},
  updateById(k,id,patch){const a=this.get(k,[]).map(x=>x.id===id?{...x,...patch}:x);this.set(k,a);return a}
};
function showToast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2500);
}
function getMondayBasedDayDiff(dateStr){
  const d=new Date(dateStr);const w=new Date(weekStart());
  return Math.floor((d-w)/(86400000));
}

function updateMetaTheme(t){const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',THEME_COLORS[t]||'#9B7EDE')}

function getDailyMotivation(){
  const d=new Date();
  const seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  return MOTIVATION_POOL[seed%MOTIVATION_POOL.length];
}
function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  const ct=$('#clockTime');if(ct)ct.textContent=`${h}:${m}:${s}`;
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const cd=$('#clockDate');if(cd)cd.textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${wd[now.getDay()]}`;
  const cg=$('#clockGreeting');if(cg){
    const hr=now.getHours();let g='';
    if(hr<6)g='夜深啦，早点休息哦~';
    else if(hr<11)g='早上好，元气满满的一天开始啦！';
    else if(hr<13)g='中午好，记得好好吃饭~';
    else if(hr<18)g='下午好，加油冲鸭！';
    else if(hr<22)g='晚上好，今天辛苦啦~';
    else g='夜晚啦，准备休息了吗？';
    cg.textContent=g;
  }
}

/* ==================== 模块渲染 ==================== */
let currentFilter='全部';
function renderModule(key){
  currentModuleKey=key;
  currentFilter='全部';
  const m=MODULES[key];
  const data=getModuleData(m);
  const stats=m.stats(data);
  let filterHtml='';
  if(m.filters){
    filterHtml=`<div class="filter-bar">${m.filters.map(f=>`<button class="filter-chip${f===currentFilter?' active':''}" data-filter="${f}">${f}</button>`).join('')}</div>`;
  }
  const html=`
  <div class="view active">
    <div class="module-header">
      <div class="module-title"><span class="emoji">${m.emoji}</span> ${m.title}</div>
      <button class="btn btn-primary" id="addBtn">➕ 添加记录</button>
    </div>
    <div class="stats-grid">${stats.map(s=>`
      <div class="stat-card">
        <div class="stat-label">${s.icon||'📊'} ${s.label}</div>
        <div class="stat-value">${s.value}<span class="unit">${s.unit||''}</span></div>
        ${s.progress!=undefined?`<div class="progress-bar"><div class="fill" style="width:${s.progress}%"></div></div>`:''}
      </div>`).join('')}</div>
    ${filterHtml}
    <div class="list-container" id="listContainer">${renderList(m,data)}</div>
  </div>`;
  $('#content').innerHTML=html;
  $('#addBtn').addEventListener('click',()=>openModal(m));
  if(m.filters){
    $$('.filter-chip').forEach(c=>c.addEventListener('click',()=>{
      currentFilter=c.dataset.filter;
      $$('.filter-chip').forEach(x=>x.classList.toggle('active',x===c));
      $('#listContainer').innerHTML=renderList(m,getModuleData(m));
      bindDeleteActions(m);
    }));
  }
  bindDeleteActions(m);
}
function getModuleData(m){
  if(m.mode==='daily'){
    const today=todayKey();
    return Store.get(m.storeKey+today,{date:today,meals:[]});
  }
  return Store.get(m.storeKey,[]);
}
function getFilteredData(m,data){
  if(!m.filters||currentFilter==='全部')return data;
  if(m.mode==='daily')return{...data,meals:data.meals||[]};
  return data.filter(x=>x.status===currentFilter);
}
function renderList(m,data){
  let items;
  if(m.mode==='daily'){items=data.meals||[]}
  else{items=getFilteredData(m,data)}
  if(!items.length)return`<div class="empty-state"><span class="emoji">${m.emoji}</span><span class="text">还没有记录哦，点击「添加记录」开始吧~</span></div>`;
  const sorted=m.mode==='accumulate'?[...items].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)):[...items].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return sorted.map(item=>{
    const fieldsHtml=m.listCols.map(col=>{
      let val=item[col.k];
      if(col.stars&&val)return`<span class="stars">${'★'.repeat(val)}${'☆'.repeat(5-val)}</span>`;
      if(col.mood&&val){const emojis=['😢','😐','🙂','😊','🥰'];return`<span>${emojis[val-1]||'🙂'} (${val}/5)</span>`}
      if(col.badge&&val)return`<span class="badge ${val==='收入'?'badge-income':'badge-expense'}">${val}</span>`;
      if(col.statusBadge&&val){const cls=val==='已发布'||val==='看过'?'s-done':val==='制作中'||val==='在看'?'s-progress':val==='弃剧'?'s-drop':'s-pending';return`<span class="badge badge-status ${cls}">${val}</span>`}
      if(col.ep&&val!=null)return`${val}${item.totalEp?'/'+item.totalEp:''}`;
      if(col.u&&val!=null&&val!=='')return`${val} ${col.u}`;
      return esc(val||'');
    }).map(v=>`<span class="item-field"><span class="field-label"></span><span class="field-value">${v||'—'}</span></span>`).join('');
    return`<div class="list-item">
      <div class="item-main">
        ${item.title?`<div class="item-title">${esc(item.title)}</div>`:''}
        <div class="item-row">${fieldsHtml}</div>
        ${item.note?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">${esc(item.note)}</div>`:''}
        ${item.reflection?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">💡 ${esc(item.reflection)}</div>`:''}
        ${item.opinion?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">💭 ${esc(item.opinion)}</div>`:''}
        ${item.review?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">📝 ${esc(item.review)}</div>`:''}
        ${item.achievements?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">✨ ${esc(item.achievements)}</div>`:''}
        ${item.tomorrowPlan?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">📌 ${esc(item.tomorrowPlan)}</div>`:''}
        ${item.gratitude?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">🙏 ${esc(item.gratitude).replace(/\n/g,'<br>')}</div>`:''}
      </div>
      <div class="item-actions">
        ${m.mode==='accumulate'&&item.status?`<button class="btn-icon btn-sm" data-action="status" data-id="${item.id}" title="切换状态">🔄</button>`:''}
        <button class="btn-icon btn-sm" data-action="delete" data-id="${item.id}" title="删除">🗑️</button>
      </div>
    </div>`;
  }).join('');
}
function bindDeleteActions(m){
  $$('#listContainer [data-action]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      if(btn.dataset.action==='delete'){
        if(m.mode==='daily'){
          const data=getModuleData(m);
          data.meals=data.meals.filter(x=>x.id!==id);
          Store.set(m.storeKey+todayKey(),data);
        }else{
          Store.removeById(m.storeKey,id);
        }
        renderModule(currentModuleKey);
        showToast('记录已删除~');
      }else if(btn.dataset.action==='status'){
        const statuses=m.fields.find(f=>f.name==='status')?.options||[];
        const item=Store.get(m.storeKey,[]).find(x=>x.id===id);
        if(item){
          const idx=statuses.indexOf(item.status);
          item.status=statuses[(idx+1)%statuses.length];
          Store.updateById(m.storeKey,id,{status:item.status});
          renderModule(currentModuleKey);
          showToast(`状态已切换为「${item.status}」`);
        }
      }
    });
  });
}
let currentModuleKey=null;

/* ==================== 模态框（表单） ==================== */
function openModal(m,editItem){
  currentModuleKey=Object.keys(MODULES).find(k=>MODULES[k]===m);
  const isEdit=!!editItem;
  const formHtml=m.fields.map(f=>{
    const val=editItem?.[f.name]??(f.type==='date'?todayKey():(f.type==='range'?(f.min||1):''));
    const req=f.req?'<span class="req">*</span>':'';
    const label=`<label>${f.label}${req}</label>`;
    let input='';
    if(f.type==='select'){
      input=`<select class="form-control" name="${f.name}">${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
    }else if(f.type==='textarea'){
      input=`<textarea class="form-control" name="${f.name}" rows="3">${esc(val)}</textarea>`;
    }else if(f.type==='range'){
      input=`<input type="range" class="form-control" name="${f.name}" min="${f.min||1}" max="${f.max||5}" value="${val}" oninput="this.nextElementSibling.textContent=this.value">
      <div class="range-display">${val}</div>`;
    }else{
      const step=f.step?`step="${f.step}"`:'';
      input=`<input type="${f.type}" class="form-control" name="${f.name}" value="${esc(val)}" ${step}>`;
    }
    const fullW=(f.type==='textarea'||f.type==='range')?'':'form-group-in-row';
    return`<div class="form-group">${label}${input}</div>`;
  }).join('');
  // 将相邻的短字段两两组合成行
  const wrapped=wrapFormRows(m,formHtml);
  $('#modal').innerHTML=`
    <div class="modal-title">${m.emoji} ${isEdit?'编辑':'添加'}${m.title}记录</div>
    <form id="moduleForm">${wrapped}</form>
    <div class="form-actions">
      <button class="btn btn-secondary" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">${isEdit?'保存':'添加'}</button>
    </div>`;
  $('#modalOverlay').classList.add('show');
  $('#cancelBtn').addEventListener('click',closeModal);
  $('#saveBtn').addEventListener('click',()=>saveModule(m,editItem));
  $('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeModal()},{once:true});
}
function wrapFormRows(m,html){
  // 简单实现：保持原样，用CSS控制。这里不做行合并以保持简单
  return html;
}
function closeModal(){$('#modalOverlay').classList.remove('show')}
function saveModule(m,editItem){
  const form=$('#moduleForm');
  const data={};
  let valid=true;
  m.fields.forEach(f=>{
    const el=form.querySelector(`[name="${f.name}"]`);
    if(!el)return;
    let v=el.value;
    if(f.type==='number'||f.type==='range'){v=v?Number(v):null}
    data[f.name]=v;
    if(f.req&&!v&&v!==0){valid=false;el.style.borderColor='var(--danger)'}
  });
  if(!valid){showToast('请填写必填项~');return}
  if(m.mode==='daily'){
    const today=data.date||todayKey();
    const key=m.storeKey+today;
    const record=Store.get(key,{date:today,meals:[]});
    if(editItem){
      record.meals=record.meals.map(x=>x.id===editItem.id?{...x,...data}:x);
    }else{
      data.id=uid('meal');data.createdAt=Date.now();
      record.meals.push(data);
    }
    Store.set(key,record);
  }else{
    if(editItem){
      Store.updateById(m.storeKey,editItem.id,data);
    }else{
      data.id=uid('rec');data.createdAt=Date.now();
      Store.push(m.storeKey,data);
    }
  }
  closeModal();
  renderModule(currentModuleKey);
  showToast(editItem?'记录已更新~':'记录已添加~');
}
